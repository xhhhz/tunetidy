# 自定义分组示例：一级名与全路径混用
# 组的书写顺序有意义：any 模式下取第一个命中的组；写在前面的更具体的组会先接走它的歌
match = "primary"
other = true
top_n = 6

[[groups]]
name = "华语流行"
genres = ["流行-华语流行"]   # 全路径：只匹配华语流行及其下级

[[groups]]
name = "其他流行"
genres = ["流行"]            # 一级名：匹配剩下的所有流行

[[groups]]
name = "R&B 与说唱"
genres = ["R&B", "嘻哈说唱"]

[[groups]]
name = "轻音乐与纯音乐"
genres = ["轻音乐", "新世纪", "古典", "纯演奏音乐"]
